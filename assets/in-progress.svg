<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-labelledby="avi-t">
  <title id="avi-t">In progress: AV, The Forge — a 3D portfolio built with React, React Three Fiber, Three.js and a core modelled in Blender. The repository is private for now.</title>
  <defs>
    <linearGradient id="avi-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11132B"/><stop offset="1" stop-color="#090A1C"/></linearGradient>
    <radialGradient id="avi-glow" cx="90%" cy="50%" r="65%"><stop offset="0" stop-color="#4B45C6" stop-opacity=".5"/><stop offset="1" stop-color="#272A6B" stop-opacity="0"/></radialGradient>
    <linearGradient id="avi-tracegrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F2FB"/><stop offset=".5" stop-color="#A99BFF"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></linearGradient>
    <pattern id="avi-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A99BFF" stroke-opacity=".06"/></pattern>
    <filter id="avi-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="avi-clip"><rect width="1200" height="96" rx="16"/></clipPath></defs>
  <style>
    .avi-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .avi-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .avi-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .avi-in { animation: avi-in 1s cubic-bezier(.16,1,.3,1) both; }
    .avi-chip { animation: avi-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .avi-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: avi-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .avi-trace { stroke-dasharray: 150 850; animation: avi-trace 9s linear infinite; }
    @keyframes avi-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes avi-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes avi-draw { to { stroke-dashoffset: 0; } }
    @keyframes avi-trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .avi-in, .avi-chip { animation: none; } .avi-draw { animation: none; stroke-dashoffset: 0; } .avi-trace { display: none; } }
    
  </style>

  <g clip-path="url(#avi-clip)">
    <rect width="1200" height="96" fill="url(#avi-bg)"/>
    <rect x="0" width="1200" height="96" fill="url(#avi-grid)"/>
    <rect width="1200" height="96" fill="url(#avi-glow)"/>
  </g>
  <g class="avi-in">
    <rect x="28" y="30" width="132" height="30" rx="15" fill="#4B45C6" fill-opacity=".3" stroke="#A99BFF"/>
    <circle cx="48" cy="45" r="4" fill="#C4B8FF"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text class="avi-mono" x="62" y="49.5" font-size="12" letter-spacing="2" fill="#F3F2FB">IN PROGRESS</text>
    <text class="avi-serif" x="184" y="42" font-size="22" fill="#F3F2FB">AV — The Forge · a 3D portfolio</text>
    <text class="avi-sans" x="184" y="66" font-size="14" fill="#9AA0C8">React · React Three Fiber · Three.js · a core modelled in Blender. Repository is private for now.</text>
  </g>
  
  <rect x=".5" y=".5" width="1199" height="95" rx="15.5" fill="none" stroke="#A99BFF" stroke-opacity=".22"/>
  <rect class="avi-trace" style="animation-delay:-2s" x=".5" y=".5" width="1199" height="95" rx="15.5" pathLength="1000" fill="none" stroke="url(#avi-tracegrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
