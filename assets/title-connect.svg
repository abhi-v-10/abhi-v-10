<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="avt-t">
  <title id="avt-t">06 Connect — Let's build something.</title>
  <defs>
    <linearGradient id="avt-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#A99BFF"/><stop offset=".6" stop-color="#4B45C6"/><stop offset="1" stop-color="#4B45C6" stop-opacity="0"/></linearGradient>
    <linearGradient id="avt-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#A99BFF"/><stop offset=".5" stop-color="#F3F2FB"/><stop offset="1" stop-color="#A99BFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="avt-pulse"><stop offset="0" stop-color="#F3F2FB"/><stop offset=".5" stop-color="#A99BFF" stop-opacity=".6"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></radialGradient></defs>
  <style>
    .avt-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .avt-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .avt-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .avt-in { animation: avt-in 1s cubic-bezier(.16,1,.3,1) both; }
    .avt-chip { animation: avt-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .avt-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: avt-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .avt-trace { stroke-dasharray: 150 850; animation: avt-trace 9s linear infinite; }
    @keyframes avt-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes avt-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes avt-draw { to { stroke-dashoffset: 0; } }
    @keyframes avt-trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .avt-in, .avt-chip { animation: none; } .avt-draw { animation: none; stroke-dashoffset: 0; } .avt-trace { display: none; } }
    
  </style>

  <g class="avt-in"><text class="avt-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#A99BFF"><tspan fill="#E4E2FF">06</tspan>   CONNECT</text></g>
  <g class="avt-in" style="animation-delay:.2s"><text class="avt-serif" x="38" y="84" font-size="42" letter-spacing="-1" fill="#F3F2FB">Let's build <tspan font-style="italic" fill="url(#avt-sheen)">something.</tspan></text></g>
  <g class="avt-in" style="animation-delay:.45s"><text class="avt-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#9AA0C8">OPEN TO INTERNSHIPS AND COLLABORATION</text></g>
  <path class="avt-draw" d="M40 106 H1160" pathLength="1000" stroke="url(#avt-line)" stroke-width="1"/>
  <circle cx="40" cy="106" r="7" fill="url(#avt-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
