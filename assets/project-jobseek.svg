<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" role="img" aria-labelledby="avp1-t">
  <title id="avp1-t">JobSeek — Job portal with search, applications, messaging and SeekBot AI, a career agent. SeekBot calls the Django API with the user's own authorisation, so it sees only what they can. Built with React, TypeScript, Django REST Framework, FastAPI.</title>
  <defs>
    <linearGradient id="avp1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030A1C"/><stop offset=".6" stop-color="#071634"/><stop offset="1" stop-color="#0A1F4D"/>
    </linearGradient>
    <linearGradient id="avp1-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E6BFF" stop-opacity=".85"/><stop offset=".5" stop-color="#0B2A66" stop-opacity=".6"/><stop offset="1" stop-color="#5CD6FF" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="avp1-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E6BFF" stop-opacity="0"/><stop offset=".5" stop-color="#3D9BFF"/><stop offset="1" stop-color="#5CD6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avp1-aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1E6BFF" stop-opacity=".35"/><stop offset="1" stop-color="#1E6BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="avp1-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#3D9BFF" stroke-opacity=".07" stroke-width=".6"/>
    </pattern>
    <filter id="avp1-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="avp1-clip"><rect width="1200" height="214" rx="16"/></clipPath>
    <linearGradient id="avp1-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5CD6FF"/><stop offset="1" stop-color="#1448C8"/></linearGradient>
  </defs>
  <g clip-path="url(#avp1-clip)">
    <rect width="1200" height="214" fill="url(#avp1-bg)"/>
    <rect width="1200" height="214" fill="url(#avp1-grid)"/>
  </g>
  <circle cx="1010" cy="107" r="150" fill="url(#avp1-aura)"/>
  <g transform="translate(1010 107)"><path d="M -70 -28 L -14 34" stroke="#5CD6FF" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/><path d="M 70 -28 L 14 34" stroke="#5CD6FF" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/><path d="M -34 -48 L 34 -48" stroke="#5CD6FF" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
    <g transform="translate(-92 -48)"><rect x="-48" y="-17" width="96" height="34" rx="9" fill="#0B2A66" fill-opacity="0.5" stroke="#3D9BFF" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#EEF6FF">React + TS</text></g><g transform="translate(92 -48)"><rect x="-48" y="-17" width="96" height="34" rx="9" fill="#1E6BFF" fill-opacity="0.35" stroke="#3D9BFF" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#EEF6FF">SeekBot AI</text></g><g transform="translate(0 46)"><rect x="-56" y="-17" width="112" height="34" rx="9" fill="#1E6BFF" fill-opacity="0.35" stroke="#3D9BFF" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#EEF6FF">Django REST API</text></g></g>
  <text x="32" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="url(#avp1-num)" fill-opacity=".9">01</text>
  <text x="130" y="42" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3" fill="#3D9BFF">FULL-STACK · AI AGENT</text>
  <text x="130" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#EEF6FF">JobSeek</text>
  <text x="130" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#BFE0FF" fill-opacity=".88">Job portal with search, applications, messaging and SeekBot AI, a career agent. SeekBot calls</text>
  <text x="130" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#BFE0FF" fill-opacity=".88">the Django API with the user's own authorisation, so it sees only what they can.</text>
  <rect x="130" y="158" width="60" height="24" rx="12" fill="#1E6BFF" fill-opacity=".12" stroke="#3D9BFF" stroke-opacity=".45"/>
    <text x="160" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#BFE0FF">React</text><rect x="198" y="158" width="95" height="24" rx="12" fill="#1E6BFF" fill-opacity=".12" stroke="#3D9BFF" stroke-opacity=".45"/>
    <text x="245.5" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#BFE0FF">TypeScript</text><rect x="301" y="158" width="173" height="24" rx="12" fill="#1E6BFF" fill-opacity=".12" stroke="#3D9BFF" stroke-opacity=".45"/>
    <text x="387.5" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#BFE0FF">Django REST Framework</text><rect x="482" y="158" width="74" height="24" rx="12" fill="#1E6BFF" fill-opacity=".12" stroke="#3D9BFF" stroke-opacity=".45"/>
    <text x="519" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#BFE0FF">FastAPI</text>
  <rect x=".75" y=".75" width="1198.5" height="212.5" rx="15.25" fill="none" stroke="url(#avp1-edge)" stroke-width="1.5"/>
</svg>
