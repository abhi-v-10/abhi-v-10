<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 214" width="1200" height="214" role="img" aria-labelledby="avp1-t">
  <title id="avp1-t">JobSeek — Job portal with search, applications, messaging and SeekBot AI, a career agent. SeekBot calls the Django API with the user's own authorisation, so it sees only what they can. Built with React, TypeScript, Django REST Framework, FastAPI.</title>
  <defs>
    <linearGradient id="avp1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11132B"/><stop offset="1" stop-color="#090A1C"/></linearGradient>
    <radialGradient id="avp1-glow" cx="88%" cy="40%" r="65%"><stop offset="0" stop-color="#4B45C6" stop-opacity=".5"/><stop offset="1" stop-color="#272A6B" stop-opacity="0"/></radialGradient>
    <linearGradient id="avp1-tracegrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F2FB"/><stop offset=".5" stop-color="#A99BFF"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></linearGradient>
    <pattern id="avp1-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A99BFF" stroke-opacity=".06"/></pattern>
    <filter id="avp1-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="avp1-clip"><rect width="1200" height="214" rx="16"/></clipPath><linearGradient id="avp1-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B8FF"/><stop offset="1" stop-color="#4B45C6"/></linearGradient>
    <radialGradient id="avp1-aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C6CF0" stop-opacity=".28"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></radialGradient></defs>
  <style>
    .avp1-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .avp1-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .avp1-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .avp1-in { animation: avp1-in 1s cubic-bezier(.16,1,.3,1) both; }
    .avp1-chip { animation: avp1-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .avp1-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: avp1-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .avp1-trace { stroke-dasharray: 150 850; animation: avp1-trace 9s linear infinite; }
    @keyframes avp1-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes avp1-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes avp1-draw { to { stroke-dashoffset: 0; } }
    @keyframes avp1-trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .avp1-in, .avp1-chip { animation: none; } .avp1-draw { animation: none; stroke-dashoffset: 0; } .avp1-trace { display: none; } }
    
  </style>

  <g clip-path="url(#avp1-clip)">
    <rect width="1200" height="214" fill="url(#avp1-bg)"/>
    <rect x="760" width="440" height="214" fill="url(#avp1-grid)"/>
    <rect width="1200" height="214" fill="url(#avp1-glow)"/>
  </g>
  <circle cx="1010" cy="107" r="150" fill="url(#avp1-aura)"/>
  <g class="avp1-in" style="animation-delay:.1s">
    <text class="avp1-serif" x="32" y="112" font-size="64" font-weight="700" fill="url(#avp1-num)" fill-opacity=".9">01</text>
    <text class="avp1-mono" x="130" y="42" font-size="12" letter-spacing="3" fill="#A99BFF">FULL-STACK · AI AGENT</text>
    <text class="avp1-serif" x="130" y="80" font-size="32" fill="#F3F2FB">JobSeek</text>
  </g>
  <g class="avp1-in" style="animation-delay:.35s"><text class="avp1-sans" x="130" y="106" font-size="15" fill="#9AA0C8">Job portal with search, applications, messaging and SeekBot AI, a career agent. SeekBot calls</text><text class="avp1-sans" x="130" y="128" font-size="15" fill="#9AA0C8">the Django API with the user's own authorisation, so it sees only what they can.</text></g>
  <g class="avp1-chip" style="animation-delay:1.10s"><rect x="130" y="158" width="59" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp1-mono" x="159.5" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">React</text></g><g class="avp1-chip" style="animation-delay:1.20s"><rect x="197" y="158" width="94" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp1-mono" x="244" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">TypeScript</text></g><g class="avp1-chip" style="animation-delay:1.30s"><rect x="299" y="158" width="171" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp1-mono" x="384.5" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Django REST Framework</text></g><g class="avp1-chip" style="animation-delay:1.40s"><rect x="478" y="158" width="73" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp1-mono" x="514.5" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">FastAPI</text></g>
  <g transform="translate(1010 107)"><g class="avp1-in" style="animation-delay:.5s"><path d="M -70 -28 L -14 34" stroke="#A99BFF" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/><path d="M 70 -28 L 14 34" stroke="#A99BFF" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/><path d="M -34 -48 L 34 -48" stroke="#A99BFF" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/><g transform="translate(-92 -48)"><rect x="-50" y="-17" width="100" height="34" rx="17" fill="#14173A" fill-opacity="1" stroke="#A99BFF" stroke-opacity="0.5"/><text y="4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F3F2FB">React + TS</text></g><g transform="translate(92 -48)"><rect x="-50" y="-17" width="100" height="34" rx="17" fill="#4B45C6" fill-opacity="0.6" stroke="#A99BFF" stroke-opacity="0.9"/><text y="4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F3F2FB">SeekBot AI</text></g><g transform="translate(0 46)"><rect x="-62" y="-17" width="124" height="34" rx="17" fill="#4B45C6" fill-opacity="0.6" stroke="#A99BFF" stroke-opacity="0.9"/><text y="4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F3F2FB">Django REST API</text></g></g></g>
  
  <rect x=".5" y=".5" width="1199" height="213" rx="15.5" fill="none" stroke="#A99BFF" stroke-opacity=".22"/>
  <rect class="avp1-trace" style="animation-delay:-1.3s" x=".5" y=".5" width="1199" height="213" rx="15.5" pathLength="1000" fill="none" stroke="url(#avp1-tracegrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
