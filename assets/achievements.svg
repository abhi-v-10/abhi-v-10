    .avr-in { animation: avr-in 1s cubic-bezier(.16,1,.3,1) both; }
    .avr-chip { animation: avr-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .avr-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: avr-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .avr-trace { stroke-dasharray: 150 850; animation: avr-trace 9s linear infinite; }
    @keyframes avr-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes avr-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes avr-draw { to { stroke-dashoffset: 0; } }
    @keyframes avr-trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .avr-in, .avr-chip { animation: none; } .avr-draw { animation: none; stroke-dashoffset: 0; } .avr-trace { display: none; } }
    
  </style>

