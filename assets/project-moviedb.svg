<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" role="img" aria-labelledby="avp5-t">
  <title id="avp5-t">MovieDB — Movie platform with CRUD, a personal watchlist, Stripe-powered premium membership, a Gemini movie assistant for premium users and a JWT-secured REST API. Built with Django, REST APIs, JWT, Stripe, Gemini.</title>
  <defs>
    <linearGradient id="avp5-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030A1C"/><stop offset=".6" stop-color="#071634"/><stop offset="1" stop-color="#0A1F4D"/>
    </linearGradient>
    <linearGradient id="avp5-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E6BFF" stop-opacity=".85"/><stop offset=".5" stop-color="#0B2A66" stop-opacity=".6"/><stop offset="1" stop-color="#5CD6FF" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="avp5-line" x1="0" y1="0" x2="1" y2="0">
