<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 214" width="1200" height="214" role="img" aria-labelledby="avp5-t">
  <title id="avp5-t">MovieDB — Movie platform with CRUD, a personal watchlist, Stripe-powered premium membership, a Gemini movie assistant for premium users and a JWT-secured REST API. Built with Django, REST APIs, JWT, Stripe, Gemini.</title>
  <defs>
    <linearGradient id="avp5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11132B"/><stop offset="1" stop-color="#090A1C"/></linearGradient>
    <radialGradient id="avp5-glow" cx="88%" cy="40%" r="65%"><stop offset="0" stop-color="#4B45C6" stop-opacity=".5"/><stop offset="1" stop-color="#272A6B" stop-opacity="0"/></radialGradient>
    <linearGradient id="avp5-tracegrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F2FB"/><stop offset=".5" stop-color="#A99BFF"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></linearGradient>
    <pattern id="avp5-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A99BFF" stroke-opacity=".06"/></pattern>
    <filter id="avp5-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="avp5-clip"><rect width="1200" height="214" rx="16"/></clipPath><linearGradient id="avp5-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B8FF"/><stop offset="1" stop-color="#4B45C6"/></linearGradient>
    <radialGradient id="avp5-aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C6CF0" stop-opacity=".28"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></radialGradient></defs>
  <style>
    .avp5-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .avp5-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .avp5-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .avp5-in { animation: avp5-in 1s cubic-bezier(.16,1,.3,1) both; }
    .avp5-chip { animation: avp5-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .avp5-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: avp5-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .avp5-trace { stroke-dasharray: 150 850; animation: avp5-trace 9s linear infinite; }
    @keyframes avp5-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes avp5-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes avp5-draw { to { stroke-dashoffset: 0; } }
    @keyframes avp5-trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .avp5-in, .avp5-chip { animation: none; } .avp5-draw { animation: none; stroke-dashoffset: 0; } .avp5-trace { display: none; } }
    
  </style>

  <g clip-path="url(#avp5-clip)">
    <rect width="1200" height="214" fill="url(#avp5-bg)"/>
    <rect x="760" width="440" height="214" fill="url(#avp5-grid)"/>
    <rect width="1200" height="214" fill="url(#avp5-glow)"/>
  </g>
  <circle cx="1010" cy="107" r="150" fill="url(#avp5-aura)"/>
  <g class="avp5-in" style="animation-delay:.1s">
    <text class="avp5-serif" x="32" y="112" font-size="64" font-weight="700" fill="url(#avp5-num)" fill-opacity=".9">05</text>
    <text class="avp5-mono" x="130" y="42" font-size="12" letter-spacing="3" fill="#A99BFF">DJANGO · REST API</text>
    <text class="avp5-serif" x="130" y="80" font-size="32" fill="#F3F2FB">MovieDB</text>
  </g>
  <g class="avp5-in" style="animation-delay:.35s"><text class="avp5-sans" x="130" y="106" font-size="15" fill="#9AA0C8">Movie platform with CRUD, a personal watchlist, Stripe-powered premium membership, a Gemini</text><text class="avp5-sans" x="130" y="128" font-size="15" fill="#9AA0C8">movie assistant for premium users and a JWT-secured REST API.</text></g>
  <g class="avp5-chip" style="animation-delay:1.50s"><rect x="130" y="158" width="66" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp5-mono" x="163" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Django</text></g><g class="avp5-chip" style="animation-delay:1.60s"><rect x="204" y="158" width="87" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp5-mono" x="247.5" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">REST APIs</text></g><g class="avp5-chip" style="animation-delay:1.70s"><rect x="299" y="158" width="45" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp5-mono" x="321.5" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">JWT</text></g><g class="avp5-chip" style="animation-delay:1.80s"><rect x="352" y="158" width="66" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp5-mono" x="385" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Stripe</text></g><g class="avp5-chip" style="animation-delay:1.90s"><rect x="426" y="158" width="66" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp5-mono" x="459" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Gemini</text></g>
  <g transform="translate(1010 107)"><g class="avp5-in" style="animation-delay:.5s"><rect x="-120" y="-56" width="240" height="112" rx="10" fill="#14173A" stroke="#A99BFF" stroke-opacity=".55"/>
    <rect x="-100" y="-50" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="-100" y="42" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="-70" y="-50" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="-70" y="42" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="-40" y="-50" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="-40" y="42" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="-10" y="-50" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="-10" y="42" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="20" y="-50" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="20" y="42" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="50" y="-50" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="50" y="42" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="80" y="-50" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/><rect x="80" y="42" width="14" height="8" rx="2" fill="#E4E2FF" fill-opacity=".3"/>
    <circle r="24" fill="#4B45C6" fill-opacity=".55" stroke="#A99BFF"/><path d="M -7 -12 L 14 0 L -7 12 Z" fill="#F3F2FB"/></g></g>
  
  <rect x=".5" y=".5" width="1199" height="213" rx="15.5" fill="none" stroke="#A99BFF" stroke-opacity=".22"/>
  <rect class="avp5-trace" style="animation-delay:-6.5s" x=".5" y=".5" width="1199" height="213" rx="15.5" pathLength="1000" fill="none" stroke="url(#avp5-tracegrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
