<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 214" width="1200" height="214" role="img" aria-labelledby="avp2-t">
  <title id="avp2-t">IRIS — Reads photos, scans and PDFs of invoices and receipts with OCR, extracts vendor, date, line items, tax and total, checks the numbers add up, and charts where the money goes. Built with Python, Flask, Tesseract OCR, OpenCV.</title>
  <defs>
    <linearGradient id="avp2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11132B"/><stop offset="1" stop-color="#090A1C"/></linearGradient>
    <radialGradient id="avp2-glow" cx="88%" cy="40%" r="65%"><stop offset="0" stop-color="#4B45C6" stop-opacity=".5"/><stop offset="1" stop-color="#272A6B" stop-opacity="0"/></radialGradient>
    <linearGradient id="avp2-tracegrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F2FB"/><stop offset=".5" stop-color="#A99BFF"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></linearGradient>
    <pattern id="avp2-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A99BFF" stroke-opacity=".06"/></pattern>
    <filter id="avp2-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="avp2-clip"><rect width="1200" height="214" rx="16"/></clipPath><linearGradient id="avp2-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B8FF"/><stop offset="1" stop-color="#4B45C6"/></linearGradient>
    <radialGradient id="avp2-aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C6CF0" stop-opacity=".28"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></radialGradient></defs>
  <style>
    .avp2-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .avp2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .avp2-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .avp2-in { animation: avp2-in 1s cubic-bezier(.16,1,.3,1) both; }
    .avp2-chip { animation: avp2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .avp2-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: avp2-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .avp2-trace { stroke-dasharray: 150 850; animation: avp2-trace 9s linear infinite; }
    @keyframes avp2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes avp2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes avp2-draw { to { stroke-dashoffset: 0; } }
    @keyframes avp2-trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .avp2-in, .avp2-chip { animation: none; } .avp2-draw { animation: none; stroke-dashoffset: 0; } .avp2-trace { display: none; } }
    
  </style>

  <g clip-path="url(#avp2-clip)">
    <rect width="1200" height="214" fill="url(#avp2-bg)"/>
    <rect x="760" width="440" height="214" fill="url(#avp2-grid)"/>
    <rect width="1200" height="214" fill="url(#avp2-glow)"/>
  </g>
  <circle cx="1010" cy="107" r="150" fill="url(#avp2-aura)"/>
  <g class="avp2-in" style="animation-delay:.1s">
    <text class="avp2-serif" x="32" y="112" font-size="64" font-weight="700" fill="url(#avp2-num)" fill-opacity=".9">02</text>
    <text class="avp2-mono" x="130" y="42" font-size="12" letter-spacing="3" fill="#A99BFF">OCR · DOCUMENT INTELLIGENCE</text>
    <text class="avp2-serif" x="130" y="80" font-size="32" fill="#F3F2FB">IRIS</text>
  </g>
  <g class="avp2-in" style="animation-delay:.35s"><text class="avp2-sans" x="130" y="106" font-size="15" fill="#9AA0C8">Reads photos, scans and PDFs of invoices and receipts with OCR, extracts vendor, date, line</text><text class="avp2-sans" x="130" y="128" font-size="15" fill="#9AA0C8">items, tax and total, checks the numbers add up, and charts where the money goes.</text></g>
  <g class="avp2-chip" style="animation-delay:1.20s"><rect x="130" y="158" width="66" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp2-mono" x="163" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Python</text></g><g class="avp2-chip" style="animation-delay:1.30s"><rect x="204" y="158" width="59" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp2-mono" x="233.5" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Flask</text></g><g class="avp2-chip" style="animation-delay:1.40s"><rect x="271" y="158" width="115" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp2-mono" x="328.5" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Tesseract OCR</text></g><g class="avp2-chip" style="animation-delay:1.50s"><rect x="394" y="158" width="66" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp2-mono" x="427" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">OpenCV</text></g>
  <g transform="translate(1010 107)"><g class="avp2-in" style="animation-delay:.5s"><rect x="-140" y="-56" width="70" height="92" rx="8" fill="#14173A" stroke="#A99BFF" stroke-opacity=".55"/>
    <rect x="-128" y="-40" width="46" height="4" rx="2" fill="#E4E2FF" fill-opacity=".5"/><rect x="-128" y="-26" width="34" height="4" rx="2" fill="#E4E2FF" fill-opacity=".5"/><rect x="-128" y="-12" width="46" height="4" rx="2" fill="#E4E2FF" fill-opacity=".5"/><rect x="-128" y="2" width="34" height="4" rx="2" fill="#E4E2FF" fill-opacity=".5"/><rect x="-128" y="16" width="46" height="4" rx="2" fill="#E4E2FF" fill-opacity=".5"/>
    <path d="M -58 -10 H -22 m -8 -8 l 8 8 l -8 8" stroke="#C4B8FF" stroke-width="2" fill="none"/>
    <text x="-40" y="-22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#A99BFF">OCR</text>
    <rect x="40" y="-8" width="20" height="38" rx="4" fill="#7C6CF0" fill-opacity="0.45"/><rect x="70" y="-32" width="20" height="62" rx="4" fill="#7C6CF0" fill-opacity="0.7"/><rect x="100" y="-54" width="20" height="84" rx="4" fill="#7C6CF0" fill-opacity="1"/>
    <rect x="30" y="34" width="100" height="2" fill="#A99BFF" fill-opacity=".5"/></g></g>
  
  <rect x=".5" y=".5" width="1199" height="213" rx="15.5" fill="none" stroke="#A99BFF" stroke-opacity=".22"/>
  <rect class="avp2-trace" style="animation-delay:-2.6s" x=".5" y=".5" width="1199" height="213" rx="15.5" pathLength="1000" fill="none" stroke="url(#avp2-tracegrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
