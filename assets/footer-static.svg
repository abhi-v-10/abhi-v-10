<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="avf-t">
  <title id="avf-t">Thanks for stopping by</title>
  <defs>
    <linearGradient id="avf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08051A"/><stop offset="1" stop-color="#22104F"/>
    </linearGradient>
    <linearGradient id="avf-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/><stop offset=".5" stop-color="#E879F9"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="avf-glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="avf-clip"><rect width="1200" height="130" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#avf-clip)">
    <rect width="1200" height="130" fill="url(#avf-bg)"/>
    <path d="M 0 92 C 150 62, 300 112, 450 88 S 750 60, 900 90 S 1100 112, 1200 80" fill="none" stroke="url(#avf-wave)" stroke-width="3" opacity=".8" filter="url(#avf-glow)"/>
    <path d="M 0 92 C 150 62, 300 112, 450 88 S 750 60, 900 90 S 1100 112, 1200 80" pathLength="1000" fill="none" stroke="url(#avf-wave)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1000 0">
    </path>
    <text x="600" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#E9DDFF">Thanks for stopping by.</text>
    <text x="600" y="68" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="3" fill="#B197FC" fill-opacity=".85">ABHISHYANTH VEMULA · @ABHI-V-10</text>
  </g>
</svg>
