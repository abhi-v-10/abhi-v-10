<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 214" width="1200" height="214" role="img" aria-labelledby="avp4-t">
  <title id="avp4-t">ELI5 — Simplifies complex text on any page. Select text or snip the screen, pick a persona and format, then simplify or expand further. A FastAPI backend keeps API keys off the client. Built with JavaScript, Manifest V3, FastAPI, Tesseract.js.</title>
  <defs>
    <linearGradient id="avp4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11132B"/><stop offset="1" stop-color="#090A1C"/></linearGradient>
    <radialGradient id="avp4-glow" cx="88%" cy="40%" r="65%"><stop offset="0" stop-color="#4B45C6" stop-opacity=".5"/><stop offset="1" stop-color="#272A6B" stop-opacity="0"/></radialGradient>
    <linearGradient id="avp4-tracegrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F2FB"/><stop offset=".5" stop-color="#A99BFF"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></linearGradient>
    <pattern id="avp4-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A99BFF" stroke-opacity=".06"/></pattern>
    <filter id="avp4-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="avp4-clip"><rect width="1200" height="214" rx="16"/></clipPath><linearGradient id="avp4-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B8FF"/><stop offset="1" stop-color="#4B45C6"/></linearGradient>
    <radialGradient id="avp4-aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C6CF0" stop-opacity=".28"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></radialGradient></defs>
  <style>
    .avp4-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .avp4-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .avp4-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .avp4-in { animation: avp4-in 1s cubic-bezier(.16,1,.3,1) both; }
    .avp4-chip { animation: avp4-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .avp4-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: avp4-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .avp4-trace { stroke-dasharray: 150 850; animation: avp4-trace 9s linear infinite; }
    @keyframes avp4-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes avp4-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes avp4-draw { to { stroke-dashoffset: 0; } }
    @keyframes avp4-trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .avp4-in, .avp4-chip { animation: none; } .avp4-draw { animation: none; stroke-dashoffset: 0; } .avp4-trace { display: none; } }
    
  </style>

  <g clip-path="url(#avp4-clip)">
    <rect width="1200" height="214" fill="url(#avp4-bg)"/>
    <rect x="760" width="440" height="214" fill="url(#avp4-grid)"/>
    <rect width="1200" height="214" fill="url(#avp4-glow)"/>
  </g>
  <circle cx="1010" cy="107" r="150" fill="url(#avp4-aura)"/>
  <g class="avp4-in" style="animation-delay:.1s">
    <text class="avp4-serif" x="32" y="112" font-size="64" font-weight="700" fill="url(#avp4-num)" fill-opacity=".9">04</text>
    <text class="avp4-mono" x="130" y="42" font-size="12" letter-spacing="3" fill="#A99BFF">CHROME EXTENSION · AI</text>
    <text class="avp4-serif" x="130" y="80" font-size="32" fill="#F3F2FB">ELI5</text>
  </g>
  <g class="avp4-in" style="animation-delay:.35s"><text class="avp4-sans" x="130" y="106" font-size="15" fill="#9AA0C8">Simplifies complex text on any page. Select text or snip the screen, pick a persona and</text><text class="avp4-sans" x="130" y="128" font-size="15" fill="#9AA0C8">format, then simplify or expand further. A FastAPI backend keeps API keys off the client.</text></g>
  <g class="avp4-chip" style="animation-delay:1.40s"><rect x="130" y="158" width="94" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp4-mono" x="177" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">JavaScript</text></g><g class="avp4-chip" style="animation-delay:1.50s"><rect x="232" y="158" width="101" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp4-mono" x="282.5" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Manifest V3</text></g><g class="avp4-chip" style="animation-delay:1.60s"><rect x="341" y="158" width="73" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp4-mono" x="377.5" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">FastAPI</text></g><g class="avp4-chip" style="animation-delay:1.70s"><rect x="422" y="158" width="108" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp4-mono" x="476" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Tesseract.js</text></g>
  <g transform="translate(1010 107)"><g class="avp4-in" style="animation-delay:.5s"><rect x="-140" y="-44" width="150" height="6" rx="3" fill="#E4E2FF" fill-opacity=".3"/><rect x="-140" y="-26" width="128" height="6" rx="3" fill="#E4E2FF" fill-opacity=".3"/><rect x="-140" y="-8" width="110" height="6" rx="3" fill="#E4E2FF" fill-opacity=".3"/>
    <rect x="-140" y="-26" width="86" height="6" rx="3" fill="#C4B8FF"/>
    <rect x="-146" y="-31" width="98" height="16" rx="4" fill="none" stroke="#C4B8FF" stroke-dasharray="3 3"/>
    <path d="M -50 -22 C -10 -22, -10 22, 20 22" stroke="#A99BFF" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <rect x="20" y="-12" width="124" height="68" rx="12" fill="#4B45C6" fill-opacity=".4" stroke="#A99BFF"/>
    <rect x="34" y="4" width="84" height="5" rx="2.5" fill="#F3F2FB" fill-opacity=".8"/><rect x="34" y="20" width="96" height="5" rx="2.5" fill="#F3F2FB" fill-opacity=".8"/><rect x="34" y="36" width="60" height="5" rx="2.5" fill="#F3F2FB" fill-opacity=".8"/></g></g>
  
  <rect x=".5" y=".5" width="1199" height="213" rx="15.5" fill="none" stroke="#A99BFF" stroke-opacity=".22"/>
  <rect class="avp4-trace" style="animation-delay:-5.2s" x=".5" y=".5" width="1199" height="213" rx="15.5" pathLength="1000" fill="none" stroke="url(#avp4-tracegrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
