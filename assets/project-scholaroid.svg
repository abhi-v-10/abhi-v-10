<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" role="img" aria-labelledby="avp3-t">
  <title id="avp3-t">Scholaroid — School management system with a dedicated dashboard for admins, teachers, students and parents: attendance, exam scheduling, notices and internal messaging. Built with Django, Python, PostgreSQL, Google OAuth2.</title>
  <defs>
    <linearGradient id="avp3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08051A"/><stop offset=".6" stop-color="#120A2B"/><stop offset="1" stop-color="#22104F"/>
    </linearGradient>
    <linearGradient id="avp3-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".85"/><stop offset=".5" stop-color="#2B1263" stop-opacity=".6"/><stop offset="1" stop-color="#E879F9" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="avp3-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/><stop offset=".5" stop-color="#B197FC"/><stop offset="1" stop-color="#E879F9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avp3-aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="avp3-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#B197FC" stroke-opacity=".07" stroke-width=".6"/>
    </pattern>
    <filter id="avp3-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="avp3-clip"><rect width="1200" height="214" rx="16"/></clipPath>
    <linearGradient id="avp3-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E879F9"/><stop offset="1" stop-color="#5B2BD6"/></linearGradient>
  </defs>
  <g clip-path="url(#avp3-clip)">
    <rect width="1200" height="214" fill="url(#avp3-bg)"/>
    <rect width="1200" height="214" fill="url(#avp3-grid)"/>
  </g>
  <circle cx="1010" cy="107" r="150" fill="url(#avp3-aura)"/>
  <g transform="translate(1010 107)"><circle r="26" fill="#8B5CF6" fill-opacity=".3" stroke="#E879F9"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F7F2FF">School</text>
    <path d="M -26 -10 L -84 -40" stroke="#E879F9" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/><path d="M 26 -10 L 84 -40" stroke="#E879F9" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/><path d="M -26 10 L -84 40" stroke="#E879F9" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/><path d="M 26 10 L 84 40" stroke="#E879F9" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
    <g transform="translate(-110 -46)"><rect x="-38" y="-17" width="76" height="34" rx="9" fill="#2B1263" fill-opacity="0.5" stroke="#B197FC" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F7F2FF">Admin</text></g><g transform="translate(110 -46)"><rect x="-38" y="-17" width="76" height="34" rx="9" fill="#2B1263" fill-opacity="0.5" stroke="#B197FC" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F7F2FF">Teacher</text></g><g transform="translate(-110 46)"><rect x="-38" y="-17" width="76" height="34" rx="9" fill="#2B1263" fill-opacity="0.5" stroke="#B197FC" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F7F2FF">Student</text></g><g transform="translate(110 46)"><rect x="-38" y="-17" width="76" height="34" rx="9" fill="#2B1263" fill-opacity="0.5" stroke="#B197FC" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F7F2FF">Parent</text></g></g>
