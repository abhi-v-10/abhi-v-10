<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 214" width="1200" height="214" role="img" aria-labelledby="avp3-t">
  <title id="avp3-t">Scholaroid — School management system with a dedicated dashboard for admins, teachers, students and parents: attendance, exam scheduling, notices and internal messaging. Built with Django, Python, PostgreSQL, Google OAuth2.</title>
  <defs>
    <linearGradient id="avp3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11132B"/><stop offset="1" stop-color="#090A1C"/></linearGradient>
    <radialGradient id="avp3-glow" cx="88%" cy="40%" r="65%"><stop offset="0" stop-color="#4B45C6" stop-opacity=".5"/><stop offset="1" stop-color="#272A6B" stop-opacity="0"/></radialGradient>
    <linearGradient id="avp3-tracegrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F2FB"/><stop offset=".5" stop-color="#A99BFF"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></linearGradient>
    <pattern id="avp3-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A99BFF" stroke-opacity=".06"/></pattern>
    <filter id="avp3-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="avp3-clip"><rect width="1200" height="214" rx="16"/></clipPath><linearGradient id="avp3-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B8FF"/><stop offset="1" stop-color="#4B45C6"/></linearGradient>
    <radialGradient id="avp3-aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C6CF0" stop-opacity=".28"/><stop offset="1" stop-color="#7C6CF0" stop-opacity="0"/></radialGradient></defs>
  <style>
    .avp3-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .avp3-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .avp3-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .avp3-in { animation: avp3-in 1s cubic-bezier(.16,1,.3,1) both; }
    .avp3-chip { animation: avp3-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .avp3-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: avp3-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .avp3-trace { stroke-dasharray: 150 850; animation: avp3-trace 9s linear infinite; }
    @keyframes avp3-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes avp3-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes avp3-draw { to { stroke-dashoffset: 0; } }
    @keyframes avp3-trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .avp3-in, .avp3-chip { animation: none; } .avp3-draw { animation: none; stroke-dashoffset: 0; } .avp3-trace { display: none; } }
    
  </style>

  <g clip-path="url(#avp3-clip)">
    <rect width="1200" height="214" fill="url(#avp3-bg)"/>
    <rect x="760" width="440" height="214" fill="url(#avp3-grid)"/>
    <rect width="1200" height="214" fill="url(#avp3-glow)"/>
  </g>
  <circle cx="1010" cy="107" r="150" fill="url(#avp3-aura)"/>
  <g class="avp3-in" style="animation-delay:.1s">
    <text class="avp3-serif" x="32" y="112" font-size="64" font-weight="700" fill="url(#avp3-num)" fill-opacity=".9">03</text>
    <text class="avp3-mono" x="130" y="42" font-size="12" letter-spacing="3" fill="#A99BFF">DJANGO · ROLE-BASED PLATFORM</text>
    <text class="avp3-serif" x="130" y="80" font-size="32" fill="#F3F2FB">Scholaroid</text>
  </g>
  <g class="avp3-in" style="animation-delay:.35s"><text class="avp3-sans" x="130" y="106" font-size="15" fill="#9AA0C8">School management system with a dedicated dashboard for admins, teachers, students and</text><text class="avp3-sans" x="130" y="128" font-size="15" fill="#9AA0C8">parents: attendance, exam scheduling, notices and internal messaging.</text></g>
  <g class="avp3-chip" style="animation-delay:1.30s"><rect x="130" y="158" width="66" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp3-mono" x="163" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Django</text></g><g class="avp3-chip" style="animation-delay:1.40s"><rect x="204" y="158" width="66" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp3-mono" x="237" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Python</text></g><g class="avp3-chip" style="animation-delay:1.50s"><rect x="278" y="158" width="94" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp3-mono" x="325" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">PostgreSQL</text></g><g class="avp3-chip" style="animation-delay:1.60s"><rect x="380" y="158" width="115" height="26" rx="13" fill="#14173A" stroke="#A99BFF" stroke-opacity=".35"/><text class="avp3-mono" x="437.5" y="175" text-anchor="middle" font-size="11.5" fill="#E4E2FF">Google OAuth2</text></g>
  <g transform="translate(1010 107)"><g class="avp3-in" style="animation-delay:.5s"><circle r="26" fill="#4B45C6" fill-opacity=".5" stroke="#A99BFF"/><text y="4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F3F2FB">School</text>
    <path d="M -26 -10 L -84 -40" stroke="#A99BFF" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/><path d="M 26 -10 L 84 -40" stroke="#A99BFF" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/><path d="M -26 10 L -84 40" stroke="#A99BFF" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/><path d="M 26 10 L 84 40" stroke="#A99BFF" stroke-opacity=".6" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/>
    <g transform="translate(-110 -46)"><rect x="-40" y="-17" width="80" height="34" rx="17" fill="#14173A" fill-opacity="1" stroke="#A99BFF" stroke-opacity="0.5"/><text y="4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F3F2FB">Admin</text></g><g transform="translate(110 -46)"><rect x="-40" y="-17" width="80" height="34" rx="17" fill="#14173A" fill-opacity="1" stroke="#A99BFF" stroke-opacity="0.5"/><text y="4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F3F2FB">Teacher</text></g><g transform="translate(-110 46)"><rect x="-40" y="-17" width="80" height="34" rx="17" fill="#14173A" fill-opacity="1" stroke="#A99BFF" stroke-opacity="0.5"/><text y="4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F3F2FB">Student</text></g><g transform="translate(110 46)"><rect x="-40" y="-17" width="80" height="34" rx="17" fill="#14173A" fill-opacity="1" stroke="#A99BFF" stroke-opacity="0.5"/><text y="4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#F3F2FB">Parent</text></g></g></g>
  
  <rect x=".5" y=".5" width="1199" height="213" rx="15.5" fill="none" stroke="#A99BFF" stroke-opacity=".22"/>
  <rect class="avp3-trace" style="animation-delay:-3.9000000000000004s" x=".5" y=".5" width="1199" height="213" rx="15.5" pathLength="1000" fill="none" stroke="url(#avp3-tracegrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
