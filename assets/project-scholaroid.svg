<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" role="img" aria-labelledby="avp3-t">
  <title id="avp3-t">Scholaroid — School management system with a dedicated dashboard for admins, teachers, students and parents: attendance, exam scheduling, notices and internal messaging. Built with Django, Python, PostgreSQL, Google OAuth2.</title>
  <defs>
    <linearGradient id="avp3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030A1C"/><stop offset=".6" stop-color="#071634"/><stop offset="1" stop-color="#0A1F4D"/>
    </linearGradient>
    <linearGradient id="avp3-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E6BFF" stop-opacity=".85"/><stop offset=".5" stop-color="#0B2A66" stop-opacity=".6"/><stop offset="1" stop-color="#5CD6FF" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="avp3-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E6BFF" stop-opacity="0"/><stop offset=".5" stop-color="#3D9BFF"/><stop offset="1" stop-color="#5CD6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avp3-aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1E6BFF" stop-opacity=".35"/><stop offset="1" stop-color="#1E6BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="avp3-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#3D9BFF" stroke-opacity=".07" stroke-width=".6"/>
    </pattern>
    <filter id="avp3-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="avp3-clip"><rect width="1200" height="214" rx="16"/></clipPath>
    <linearGradient id="avp3-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5CD6FF"/><stop offset="1" stop-color="#1448C8"/></linearGradient>
  </defs>
  <g clip-path="url(#avp3-clip)">
    <rect width="1200" height="214" fill="url(#avp3-bg)"/>
    <rect width="1200" height="214" fill="url(#avp3-grid)"/>
  </g>
  <circle cx="1010" cy="107" r="150" fill="url(#avp3-aura)"/>
  <g transform="translate(1010 107)"><circle r="26" fill="#1E6BFF" fill-opacity=".3" stroke="#5CD6FF"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#EEF6FF">School</text>
    <path d="M -26 -10 L -84 -40" stroke="#5CD6FF" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/><path d="M 26 -10 L 84 -40" stroke="#5CD6FF" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/><path d="M -26 10 L -84 40" stroke="#5CD6FF" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/><path d="M 26 10 L 84 40" stroke="#5CD6FF" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
    <g transform="translate(-110 -46)"><rect x="-38" y="-17" width="76" height="34" rx="9" fill="#0B2A66" fill-opacity="0.5" stroke="#3D9BFF" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#EEF6FF">Admin</text></g><g transform="translate(110 -46)"><rect x="-38" y="-17" width="76" height="34" rx="9" fill="#0B2A66" fill-opacity="0.5" stroke="#3D9BFF" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#EEF6FF">Teacher</text></g><g transform="translate(-110 46)"><rect x="-38" y="-17" width="76" height="34" rx="9" fill="#0B2A66" fill-opacity="0.5" stroke="#3D9BFF" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#EEF6FF">Student</text></g><g transform="translate(110 46)"><rect x="-38" y="-17" width="76" height="34" rx="9" fill="#0B2A66" fill-opacity="0.5" stroke="#3D9BFF" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#EEF6FF">Parent</text></g></g>
  <text x="32" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="url(#avp3-num)" fill-opacity=".9">03</text>
  <text x="130" y="42" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3" fill="#3D9BFF">DJANGO · ROLE-BASED PLATFORM</text>
  <text x="130" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#EEF6FF">Scholaroid</text>
  <text x="130" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#BFE0FF" fill-opacity=".88">School management system with a dedicated dashboard for admins, teachers, students and</text>
  <text x="130" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#BFE0FF" fill-opacity=".88">parents: attendance, exam scheduling, notices and internal messaging.</text>
  <rect x="130" y="158" width="67" height="24" rx="12" fill="#1E6BFF" fill-opacity=".12" stroke="#3D9BFF" stroke-opacity=".45"/>
    <text x="163.5" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#BFE0FF">Django</text><rect x="205" y="158" width="67" height="24" rx="12" fill="#1E6BFF" fill-opacity=".12" stroke="#3D9BFF" stroke-opacity=".45"/>
    <text x="238.5" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#BFE0FF">Python</text><rect x="280" y="158" width="95" height="24" rx="12" fill="#1E6BFF" fill-opacity=".12" stroke="#3D9BFF" stroke-opacity=".45"/>
    <text x="327.5" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#BFE0FF">PostgreSQL</text><rect x="383" y="158" width="116" height="24" rx="12" fill="#1E6BFF" fill-opacity=".12" stroke="#3D9BFF" stroke-opacity=".45"/>
    <text x="441" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#BFE0FF">Google OAuth2</text>
  <rect x=".75" y=".75" width="1198.5" height="212.5" rx="15.25" fill="none" stroke="url(#avp3-edge)" stroke-width="1.5"/>
