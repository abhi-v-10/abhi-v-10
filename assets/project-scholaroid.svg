  <text x="130" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#E9DDFF" fill-opacity=".88">parents: attendance, exam scheduling, notices and internal messaging.</text>
  <rect x="130" y="158" width="67" height="24" rx="12" fill="#8B5CF6" fill-opacity=".12" stroke="#B197FC" stroke-opacity=".45"/>
    <text x="163.5" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#E9DDFF">Django</text><rect x="205" y="158" width="67" height="24" rx="12" fill="#8B5CF6" fill-opacity=".12" stroke="#B197FC" stroke-opacity=".45"/>
    <text x="238.5" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#E9DDFF">Python</text><rect x="280" y="158" width="95" height="24" rx="12" fill="#8B5CF6" fill-opacity=".12" stroke="#B197FC" stroke-opacity=".45"/>
    <text x="327.5" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#E9DDFF">PostgreSQL</text><rect x="383" y="158" width="116" height="24" rx="12" fill="#8B5CF6" fill-opacity=".12" stroke="#B197FC" stroke-opacity=".45"/>
    <text x="441" y="174" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#E9DDFF">Google OAuth2</text>
