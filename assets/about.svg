  <style>
    .ava-serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
    .ava-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .ava-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .ava-in { animation: ava-in 1s cubic-bezier(.16,1,.3,1) both; }
    .ava-chip { animation: ava-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .ava-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: ava-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .ava-trace { stroke-dasharray: 150 850; animation: ava-trace 9s linear infinite; }
    @keyframes ava-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes ava-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes ava-draw { to { stroke-dashoffset: 0; } }
    @keyframes ava-trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ava-in, .ava-chip { animation: none; } .ava-draw { animation: none; stroke-dashoffset: 0; } .ava-trace { display: none; } }
    .ava-type { transform-box: fill-box; transform-origin: left center; animation-name: ava-type; animation-fill-mode: both; }
    @keyframes ava-type { 0% { transform: scaleX(0); } 85%, 100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .ava-type { animation: none; } }
  </style>

