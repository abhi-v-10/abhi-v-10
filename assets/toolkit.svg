  <title id="avk-t">Toolkit. languages: Python, JavaScript, TypeScript, C++, C. backend: Django, Django REST Framework, FastAPI, Flask, FastMCP, Node.js, Express.js, REST APIs, JWT, Celery. ai: OpenAI API, Google Gemini, Claude, Pydantic, Retrieval, Prompt Engineering. frontend: React, Vite, Tailwind CSS, HTML, CSS. data: PostgreSQL, MongoDB, SQLite, Redis. tools &amp; 3d: Git, GitHub Actions, Linux, Three.js, WebGL, Blender.</title>
