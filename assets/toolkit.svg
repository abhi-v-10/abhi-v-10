    .avk-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .avk-in { animation: avk-in 1s cubic-bezier(.16,1,.3,1) both; }
    .avk-chip { animation: avk-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    .avk-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: avk-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    .avk-trace { stroke-dasharray: 150 850; animation: avk-trace 9s linear infinite; }
    @keyframes avk-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes avk-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes avk-draw { to { stroke-dashoffset: 0; } }
    @keyframes avk-trace { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .avk-in, .avk-chip { animation: none; } .avk-draw { animation: none; stroke-dashoffset: 0; } .avk-trace { display: none; } }
    
  </style>

