<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="avh-t avh-d">
  <title id="avh-t">Abhishyanth Vemula — BTech 3rd Year Student | AI-Backend Developer</title>
  <desc id="avh-d">Burgundy banner with a fine technical grid, restrained orbital geometry and a glowing underline (static version).</desc>
  <defs>
    <linearGradient id="avh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/><stop offset=".55" stop-color="#190B12"/><stop offset="1" stop-color="#240D18"/>
    </linearGradient>
    <radialGradient id="avh-glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".55"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avh-glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity=".22"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avh-fade" cx=".5" cy=".5" r=".62">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="avh-gridmask"><rect width="1200" height="420" fill="url(#avh-fade)"/></mask>
    <pattern id="avh-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#C77B9B" stroke-opacity=".10" stroke-width=".6"/>
    </pattern>
    <linearGradient id="avh-trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/><stop offset=".3" stop-color="#C77B9B"/><stop offset=".6" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="avh-ul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/><stop offset=".55" stop-color="#C77B9B"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="avh-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/><stop offset=".5" stop-color="#F8F0F3"/><stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="avh-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <filter id="avh-glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="avh-dotglow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <clipPath id="avh-clip"><rect width="1200" height="420" rx="18"/></clipPath>
    <path id="avh-path" d="M 40 358 C 220 322, 330 396, 520 354 S 800 304, 1010 342 S 1140 376, 1170 344"/>
  </defs>

  <g clip-path="url(#avh-clip)">
    <rect width="1200" height="420" fill="url(#avh-bg)"/>

    <!-- drifting colour fields -->
    <circle cx="260" cy="130" r="340" fill="url(#avh-glowA)">
    </circle>
    <circle cx="990" cy="300" r="300" fill="url(#avh-glowB)">
    </circle>

    <!-- fine technical grid -->
    <rect width="1200" height="420" fill="url(#avh-grid)" mask="url(#avh-gridmask)"/>

    <!-- restrained orbital geometry -->
    <g transform="translate(985 205)" fill="none" stroke="#C77B9B">
      <circle r="150" stroke-opacity=".28" stroke-dasharray="2 7"/>
      <circle r="88" stroke-opacity=".22"/>
      <g>
        <ellipse rx="150" ry="52" transform="rotate(-24)" stroke-opacity=".30"/>
        <ellipse rx="150" ry="52" transform="rotate(36)" stroke-opacity=".18"/>
      </g>
      <circle r="5" fill="#E5B5C7" stroke="none"/>
      <circle r="12" fill="#C77B9B" fill-opacity=".35" stroke="none" filter="url(#avh-dotglow)"/>
      <g>
        <g transform="rotate(205)">
          <circle cx="150" r="4" fill="#E5B5C7" stroke="none"/>
          <circle cx="150" r="9" fill="#E5B5C7" fill-opacity=".5" stroke="none" filter="url(#avh-dotglow)"/>
        </g>
      </g>
      <g>
        <g transform="rotate(40)">
          <circle cx="88" r="3" fill="#C77B9B" stroke="none"/>
        </g>
      </g>
    </g>

    <!-- animated path trace -->
    <use href="#avh-path" fill="none" stroke="#C77B9B" stroke-opacity=".16" stroke-width="1.2"/>
    <path d="M 40 358 C 220 322, 330 396, 520 354 S 800 304, 1010 342 S 1140 376, 1170 344" pathLength="1000" fill="none" stroke="url(#avh-trace)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="260 740" stroke-dashoffset="-310">
    </path>
    <circle cx="520" cy="354" r="3.5" fill="#E5B5C7"/>

    <!-- technical marks -->
    <g stroke="#C77B9B" stroke-opacity=".5" stroke-width="1" fill="none">
      <path d="M 28 52 V 28 H 52"/><path d="M 1172 52 V 28 H 1148"/><path d="M 28 368 V 392 H 52"/><path d="M 1172 368 V 392 H 1148"/>
    </g>
    <text x="1148" y="62" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2" fill="#C77B9B" fill-opacity=".7">17.385°N 78.487°E</text>

    <!-- identity -->
    <text x="80" y="122" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="4" fill="#C77B9B">B.TECH COMPUTER SCIENCE · HYDERABAD</text>
    <text x="78" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="74" letter-spacing="-1" fill="url(#avh-name)">Abhishyanth Vemula</text>
    <text x="80" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" letter-spacing="1" fill="#E5B5C7">BTech 3rd Year Student  <tspan fill="#C77B9B">|</tspan>  AI-Backend Developer</text>

    <!-- glowing underline -->
    <rect x="80" y="284" width="470" height="4" rx="2" fill="url(#avh-ul)" opacity=".9" filter="url(#avh-glow)"/>
    <rect x="80" y="284" width="470" height="3" rx="1.5" fill="url(#avh-ul)"/>
    <rect x="250" y="284" width="110" height="3" rx="1.5" fill="url(#avh-shine)" opacity=".6"/>

    <text x="80" y="326" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#C77B9B" fill-opacity=".85">DJANGO · FASTAPI · REST APIS · AI AGENTS</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="17.5" fill="none" stroke="#451126"/>
</svg>
